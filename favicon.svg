<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bc13fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle (Dark) -->
  <circle cx="50" cy="50" r="48" fill="#050505" />
  
  <!-- Glowing Ring -->
  <circle cx="50" cy="50" r="45" stroke="url(#grad)" stroke-width="3" fill="none" filter="url(#glow)" />
  
  <!-- Letter A -->
  <text x="50" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="65" fill="url(#grad)" filter="url(#glow)">A</text>
</svg>
